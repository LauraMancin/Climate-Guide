<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="shortcut icon" href="./images/weather-icon.png" type="image/x-icon">
    <title>Climate Guide</title>
</head>
<body>
    <main>
        <section class="tituloPrincipal">
            <h1>Bem-vindo ao Climate Guide</h1>

            <p>Digite o local que deseja ver o clima</p>
        </section>

        <section class="selecao" id="selecao">
            <div class="escolha">
                <div class="opcoes">
                    <p>Escolha o Local</p>
                    <input type="text" name="Cidade" id="cidade">
                </div>

                <button class="botaoBuscar" id="botaoBuscar">Buscar</button>
                
            </div>

            <section class="resultado">
    
                <h2 id="nomeCidade">
                    Cidade
                </h2>
    
                <p class="temperatura">
                    <span id="temperatura">--</span> °C
                </p>
    
                <!-- Clima e sensação térmica -->
                <div class="linha">
                    <p>
                        <img src="./images/weather-icon.png">
                        Clima:
                        <span id="descricao">--</span>
                    </p>
        
                    <p>
                        <img src="./images/dry.png">
                        Sensação térmica:
                        <span id="sensacao">--</span> °C
                    </p>
                </div>

                <!-- Umidade e chuva -->
                <div class="linha">
                    <p>
                        <img src="./images/wet.png">
                        Umidade:
                        <span id="umidade">--</span>%
                    </p>
        
                    <p>
                        <img src="./images/rain.png">
                        Chuva:
                        <span id="chuva">--</span>mm
                    </p>
                </div>

                <!-- vento -->
                <div class="linha">
                    <p>
                        <img src="./images/wind.png">
                        Vento:
                        <span id="vento">--</span> km/h
                    </p>

                    <p>
                        <img src="./images/wind.png">
                        Rajada de Vento:
                        <span id="rajada">--</span> km/h
                    </p>
                </div>
                
                <!-- Sol -->
                <div class="linha">
                    <p>
                        <img src="./images/sunrise.png">
                        Nascer do Sol:
                        <span id="nascerSol">--</span> 
                    </p>

                    <p>
                        <img src="./images/sunset.png">
                        Pôr do Sol:
                        <span id="porSol">--</span> 
                    </p>
                </div>

                <!-- Lua e estações -->
                <div class="linha">
                    <p>
                        <img src="./images/moon-phase.png">
                        Fase da Lua:
                        <span id="faseLua">--</span> 
                    </p>

                    <p>
                        <img src="">
                        Estação
                        <span id="estacao">--</span> 
                    </p>
                </div>
    
            </section>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
